<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Etiquetas</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
    :root { --label-w: 90mm; --label-h: 29mm; }
    body { font-family: Arial, Helvetica, sans-serif; margin: 0; background: #eee; }
    .toolbar { padding: 16px; background: #fff; border-bottom: 1px solid #ccc; }
    .toolbar select, .toolbar button { font-size: 1rem; padding: 6px 10px; }
    .hoja { padding: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
    .etiqueta {
        width: var(--label-w); height: var(--label-h);
        border: 1px dashed #999;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        padding: 2mm; box-sizing: border-box; background: #fff;
        page-break-inside: avoid;
    }
    .etiqueta .info { font-size: 9px; text-align: center; line-height: 1.2; margin-bottom: 1mm; }
    .etiqueta svg { max-width: 100%; }

    /* Modo patilla: el código completo (texto + barras) queda comprimido en
       la MITAD de la etiqueta (la que va a quedar visible por afuera), y la
       otra mitad queda en blanco a propósito — es la "cola" que se dobla y
       pega por dentro/atrás de la patilla. Así el código nunca queda partido
       por el doblez.
       La orientación (de qué lado queda la mitad con contenido, y si va
       rotado 90°) es ajustable desde la barra de arriba: se deja probar
       varias combinaciones en la impresora real para ver cuál queda bien. */
    .hoja.modo-patilla .etiqueta { align-items: center; }
    .hoja.modo-patilla.mitad-izquierda .etiqueta { flex-direction: row; justify-content: flex-start; }
    .hoja.modo-patilla.mitad-derecha .etiqueta { flex-direction: row-reverse; justify-content: flex-start; }
    .hoja.modo-patilla.mitad-arriba .etiqueta { flex-direction: column; justify-content: flex-start; }
    .hoja.modo-patilla.mitad-abajo .etiqueta { flex-direction: column-reverse; justify-content: flex-start; }
    .hoja.modo-patilla.mitad-izquierda .etiqueta .contenido,
    .hoja.modo-patilla.mitad-derecha .etiqueta .contenido { width: 50%; height: 100%; flex-shrink: 0; }
    .hoja.modo-patilla.mitad-arriba .etiqueta .contenido,
    .hoja.modo-patilla.mitad-abajo .etiqueta .contenido { width: 100%; height: 50%; flex-shrink: 0; }
    .hoja.modo-patilla .etiqueta .info { margin-bottom: 0.5mm; }
    .hoja.modo-patilla.rotar-90 .etiqueta .contenido { transform: rotate(90deg); }

    @media print {
        .toolbar { display: none; }
        body { background: #fff; }
        .hoja { padding: 0; gap: 0; }
        .etiqueta { border: none; page-break-after: always; }
        @page { size: auto; margin: 3mm; }
    }
</style>
</head>
<body>

<div class="toolbar">
    <label>Tamaño de etiqueta:
        <select id="tamano">
            <option value="90x29">DK-1201 · 90 x 29 mm (precortada, la que trae la impresora)</option>
            <option value="62x30">Cinta continua 62mm · 62 x 30 mm</option>
            <option value="50x25">Cinta continua 62mm chica · 50 x 25 mm</option>
        </select>
    </label>
    <label style="margin-left: 12px;">
        <input type="checkbox" id="chk-patilla">
        🦴 Etiqueta para patilla (código compacto en la mitad, para doblar)
    </label>
    <label style="margin-left: 12px;">Mitad con contenido:
        <select id="mitad-patilla">
            <option value="izquierda">Izquierda</option>
            <option value="derecha">Derecha</option>
            <option value="arriba">Arriba</option>
            <option value="abajo">Abajo</option>
        </select>
    </label>
    <label style="margin-left: 12px;">
        <input type="checkbox" id="chk-rotar-patilla">
        Rotar contenido 90°
    </label>
    <button onclick="window.print()">🖨️ Imprimir</button>
    <span style="color:#666; margin-left: 12px;">{{ productos|length }} etiqueta{{ productos|length|pluralize }}</span>
</div>

<div class="hoja" id="hoja">
    {% for p in productos %}
    <div class="etiqueta">
        <div class="contenido">
            <div class="info">
                {% if p.marca %}{{ p.marca }} - {% endif %}{{ p.modelo }}{% if p.color %} · {{ p.color }}{% endif %}
            </div>
            <svg class="barcode" data-codigo="{{ p.codigo_barras }}"></svg>
        </div>
    </div>
    {% endfor %}
</div>

<script>
function render() {
    document.querySelectorAll('.barcode').forEach(function (svg) {
        JsBarcode(svg, svg.dataset.codigo, {
            format: "CODE128",
            width: 1.5,
            height: 30,
            fontSize: 11,
            margin: 0,
        });
    });
}
render();

const presets = {
    "90x29": ["90mm", "29mm"],
    "62x30": ["62mm", "30mm"],
    "50x25": ["50mm", "25mm"],
};
document.getElementById('tamano').addEventListener('change', function (e) {
    const [w, h] = presets[e.target.value];
    document.documentElement.style.setProperty('--label-w', w);
    document.documentElement.style.setProperty('--label-h', h);
});

const hoja = document.getElementById('hoja');
document.getElementById('chk-patilla').addEventListener('change', function (e) {
    hoja.classList.toggle('modo-patilla', e.target.checked);
});
document.getElementById('mitad-patilla').addEventListener('change', function (e) {
    hoja.classList.remove('mitad-izquierda', 'mitad-derecha', 'mitad-arriba', 'mitad-abajo');
    hoja.classList.add('mitad-' + e.target.value);
});
document.getElementById('chk-rotar-patilla').addEventListener('change', function (e) {
    hoja.classList.toggle('rotar-90', e.target.checked);
});
hoja.classList.add('mitad-izquierda');
</script>

</body>
</html>

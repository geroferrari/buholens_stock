{% extends "base.html" %}
{% block title %}Eliminar{% endblock %}
{% block content %}

<div class="card shadow-sm" style="max-width: 500px;">
    <div class="card-body">
        <h4>¿Eliminar este registro?</h4>
        <p class="text-muted">{{ object }}</p>
        <p>Esta acción no se puede deshacer.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            {% if cancel_url %}<a href="{{ cancel_url }}" class="btn btn-outline-secondary">Cancelar</a>{% endif %}
        </form>
    </div>
</div>

{% endblock %}

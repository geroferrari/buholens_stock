{% extends "base.html" %}
{% block title %}Cambiar contraseña{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="mb-3">Cambiar contraseña</h4>
                {% if form.errors %}
                <div class="alert alert-danger py-2">Revisá los datos: {{ form.errors }}</div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Contraseña actual</label>
                        <input type="password" name="old_password" class="form-control" autofocus required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña nueva</label>
                        <input type="password" name="new_password1" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Repetir contraseña nueva</label>
                        <input type="password" name="new_password2" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Guardar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

<!-- Widget de escaneo compartido entre ingreso de mercadería y devoluciones:
     un input de código con autofoco y Enter, cantidad, motivo opcional, y un
     botón de registrar. Se incluye pasando por contexto: post_url (URL
     resuelta a la que postear), boton_label, e incluir_motivo (True/False). -->
<div class="card shadow-sm">
    <div class="card-body">
        <div class="row g-2 align-items-end">
            <div class="col-md-{% if incluir_motivo %}5{% else %}6{% endif %}">
                <label class="form-label">Código de barras</label>
                <div class="input-group">
                    <input type="text" id="codigo-input" class="form-control" autofocus autocomplete="off">
                    {% include "partials/camera_scan_button.html" with input_id="codigo-input" %}
                </div>
            </div>
            <div class="col-md-2">
                <label class="form-label">Cantidad</label>
                <input type="number" id="cantidad-input" class="form-control" value="1" min="1">
            </div>
            {% if incluir_motivo %}
            <div class="col-md-3">
                <label class="form-label">Motivo (opcional)</label>
                <input type="text" id="motivo-input" class="form-control" placeholder="Ej: talle incorrecto">
            </div>
            {% endif %}
            <div class="col-md-{% if incluir_motivo %}2{% else %}3{% endif %}">
                <button id="btn-registrar" class="btn btn-primary w-100">{{ boton_label|default:"Registrar" }}</button>
            </div>
        </div>
        <div id="resultado" class="mt-3"></div>
    </div>
</div>

<script>
(function() {
    const csrftoken = document.cookie.split('; ').find(r => r.startsWith('csrftoken='))?.split('=')[1];
    const codigoInput = document.getElementById('codigo-input');
    const cantidadInput = document.getElementById('cantidad-input');
    const motivoInput = document.getElementById('motivo-input');
    const resultado = document.getElementById('resultado');

    function registrar() {
        const codigo = codigoInput.value.trim();
        if (!codigo) return;
        const datos = {codigo, cantidad: cantidadInput.value || 1};
        if (motivoInput) datos.motivo = motivoInput.value;
        const body = new URLSearchParams(datos);
        fetch('{{ post_url }}', {
            method: 'POST',
            headers: {'X-CSRFToken': csrftoken, 'Content-Type': 'application/x-www-form-urlencoded'},
            body,
        }).then(r => r.text()).then(html => {
            resultado.innerHTML = html;
            codigoInput.value = '';
            if (motivoInput) motivoInput.value = '';
            cantidadInput.value = 1;
            codigoInput.focus();
        });
    }

    document.getElementById('btn-registrar').addEventListener('click', registrar);
    codigoInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); registrar(); } });
    window.addEventListener('load', () => codigoInput.focus());
})();
</script>
